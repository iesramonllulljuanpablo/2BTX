<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
</head>
<body>
    <h1>Cálculo de precio con descuento</h1>
    <label for="precio">Precio base (€):</label><br>
    <input type="number" name="" id="precio"><br><br>

    <label for="">Es residente?</label><br>
    <input type="radio" name="residente" id="residenteSi">
    <label for="">Si</label>
    <input type="radio" name="residente" id="residenteNo">
    <label for="">No</label><br><br>

    <label for="">Tipo de familia?</label><br>
    <input type="radio" name="familia" id="familiaEspecial">
    <label for="">Familia especial</label>
    <input type="radio" name="familia" id="familiaGeneral">
    <label for="">Familia general</label>
    <input type="radio" name="familia" id="noFamiliaNumerosa">
    <label for="">Ninguna de las anteriores</label><br>
    <br>
    <button type="button" onclick="calcularPrecio()">Cálcular precio final</button>
</body>
</html>
