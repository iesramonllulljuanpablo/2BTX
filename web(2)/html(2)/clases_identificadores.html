<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            margin:20px
        }
        #soyespecial {
            color: red;
        }
        .somosespeciales {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Identificadores</h1>
    <p>Los Identificadores permiten seleccionar un solo elemento de una página web</p>
    <p>Este es un párrafo normal</p>
    <p id="soyespecial">Este párrafo es especial</p>
    <h1>Clases</h1>
    <p>Las clases hacen referencia a dos o más elementos de una página</p>
    <p class="somosespeciales">Somos especiales</p>
    <p class="somosespeciales">Porque somos de la misma clase</p>
</body>
</html>
